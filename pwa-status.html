<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PWA Status - ParkPay</title>
    
    <!-- PWA Configuration -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#007bff">
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            color: white;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: rgba(255,255,255,0.1);
            padding: 30px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }
        .status-item {
            background: rgba(255,255,255,0.1);
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .status-good { border-left: 4px solid #28a745; }
        .status-bad { border-left: 4px solid #dc3545; }
        .status-warning { border-left: 4px solid #ffc107; }
        
        .button {
            background: #007bff;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            margin: 10px 5px;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        .button:hover {
            background: #0056b3;
            transform: translateY(-2px);
        }
        .button:disabled {
            background: #6c757d;
            cursor: not-allowed;
            transform: none;
        }
        
        .icon {
            font-size: 1.5rem;
            margin-right: 10px;
        }
        
        .back-btn {
            background: rgba(255,255,255,0.2);
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 15px;
            display: inline-block;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="inicio.html" class="back-btn">← Volver al Inicio</a>
        
        <h1>📱 PWA Status - ParkPay</h1>
        <p>Estado de funcionalidades de Progressive Web App</p>
        
        <div id="statusContainer">
            <div class="status-item status-warning">
                <div>
                    <span class="icon">⏳</span>
                    <strong>Verificando funcionalidades...</strong>
                </div>
            </div>
        </div>
        
        <div style="margin-top: 30px;">
            <h3>Acciones PWA</h3>
            <button id="installBtn" class="button" onclick="installPWA()" disabled>
                📱 Instalar PWA
            </button>
            <button class="button" onclick="checkCacheStatus()">
                📦 Verificar Cache
            </button>
            <button class="button" onclick="clearCache()">
                🗑️ Limpiar Cache
            </button>
            <button class="button" onclick="updateSW()">
                🔄 Actualizar SW
            </button>
        </div>
        
        <div id="cacheInfo" style="margin-top: 20px; font-size: 0.9rem; opacity: 0.8;">
            <!-- Cache info aparecerá aquí -->
        </div>
    </div>

    <script>
        let deferredPrompt;
        
        // Verificar todas las funcionalidades PWA
        async function checkPWAFeatures() {
            const container = document.getElementById('statusContainer');
            container.innerHTML = '';
            
            const features = [
                {
                    name: 'Service Worker',
                    check: () => 'serviceWorker' in navigator,
                    icon: '⚙️'
                },
                {
                    name: 'Web App Manifest',
                    check: async () => {
                        try {
                            const response = await fetch('/manifest.json');
                            return response.ok;
                        } catch {
                            return false;
                        }
                    },
                    icon: '📋'
                },
                {
                    name: 'App Instalada',
                    check: () => window.matchMedia('(display-mode: standalone)').matches,
                    icon: '📱'
                },
                {
                    name: 'Notificaciones',
                    check: () => 'Notification' in window,
                    icon: '🔔'
                },
                {
                    name: 'Cache API',
                    check: () => 'caches' in window,
                    icon: '📦'
                },
                {
                    name: 'Conexión',
                    check: () => navigator.onLine,
                    icon: '🌐'
                }
            ];
            
            for (const feature of features) {
                const status = await feature.check();
                const statusClass = status ? 'status-good' : 'status-bad';
                const statusText = status ? '✅ Activo' : '❌ No disponible';
                
                container.innerHTML += `
                    <div class="status-item ${statusClass}">
                        <div>
                            <span class="icon">${feature.icon}</span>
                            <strong>${feature.name}</strong>
                        </div>
                        <span>${statusText}</span>
                    </div>
                `;
            }
        }
        
        // Instalar PWA
        function installPWA() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        console.log('✅ PWA instalada');
                    } else {
                        console.log('❌ Instalación cancelada');
                    }
                    deferredPrompt = null;
                    document.getElementById('installBtn').disabled = true;
                });
            }
        }
        
        // Verificar estado del cache
        async function checkCacheStatus() {
            const info = document.getElementById('cacheInfo');
            try {
                const cacheNames = await caches.keys();
                let totalSize = 0;
                let totalFiles = 0;
                
                for (const cacheName of cacheNames) {
                    const cache = await caches.open(cacheName);
                    const keys = await cache.keys();
                    totalFiles += keys.length;
                }
                
                info.innerHTML = `
                    <h4>📊 Información del Cache</h4>
                    <p>• Caches activos: ${cacheNames.length}</p>
                    <p>• Archivos cacheados: ${totalFiles}</p>
                    <p>• Caches: ${cacheNames.join(', ')}</p>
                `;
            } catch (error) {
                info.innerHTML = `❌ Error al verificar cache: ${error.message}`;
            }
        }
        
        // Limpiar cache
        async function clearCache() {
            try {
                const cacheNames = await caches.keys();
                await Promise.all(
                    cacheNames.map(cacheName => caches.delete(cacheName))
                );
                alert('✅ Cache limpiado exitosamente');
                location.reload();
            } catch (error) {
                alert('❌ Error al limpiar cache: ' + error.message);
            }
        }
        
        // Actualizar Service Worker
        function updateSW() {
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then(registrations => {
                    registrations.forEach(registration => {
                        registration.update();
                    });
                    alert('🔄 Verificando actualizaciones del Service Worker...');
                });
            }
        }
        
        // Event listeners
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('installBtn').disabled = false;
        });
        
        window.addEventListener('appinstalled', (evt) => {
            console.log('🎉 PWA instalada exitosamente');
            document.getElementById('installBtn').disabled = true;
            setTimeout(checkPWAFeatures, 1000);
        });
        
        // Registrar Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(registration => {
                        console.log('✅ SW registrado:', registration.scope);
                    })
                    .catch(error => {
                        console.error('❌ SW registration failed:', error);
                    });
            });
        }
        
        // Inicializar verificaciones
        window.addEventListener('load', () => {
            checkPWAFeatures();
            checkCacheStatus();
        });
    </script>
</body>
</html>
