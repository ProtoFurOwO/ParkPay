<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Fondo del icono con gradiente -->
  <defs>
    <linearGradient id="carGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="checkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fondo redondeado -->
  <rect width="200" height="200" rx="40" fill="#f0f9ff"/>
  
  <!-- Carro simplificado -->
  <g transform="translate(30, 80)">
    <!-- Cuerpo del carro -->
    <rect x="10" y="25" width="100" height="35" rx="5" fill="url(#carGradient)"/>
    
    <!-- Techo del carro -->
    <path d="M 30 25 L 50 5 L 80 5 L 90 25 Z" fill="url(#carGradient)" opacity="0.9"/>
    
    <!-- Ventanas -->
    <rect x="35" y="10" width="18" height="12" rx="2" fill="#e0f2fe"/>
    <rect x="65" y="10" width="18" height="12" rx="2" fill="#e0f2fe"/>
    
    <!-- Ruedas -->
    <circle cx="30" cy="63" r="8" fill="#1e293b"/>
    <circle cx="30" cy="63" r="4" fill="#64748b"/>
    <circle cx="90" cy="63" r="8" fill="#1e293b"/>
    <circle cx="90" cy="63" r="4" fill="#64748b"/>
    
    <!-- Faros -->
    <circle cx="115" cy="35" r="3" fill="#fef08a"/>
    <circle cx="5" cy="35" r="3" fill="#fef08a"/>
  </g>
  
  <!-- Check mark (palomita) -->
  <g transform="translate(120, 40)">
    <!-- Círculo de fondo para el check -->
    <circle cx="30" cy="30" r="28" fill="url(#checkGradient)"/>
    <circle cx="30" cy="30" r="24" fill="white"/>
    <circle cx="30" cy="30" r="20" fill="url(#checkGradient)"/>
    
    <!-- Palomita -->
    <path d="M 20 30 L 27 38 L 42 20" 
          stroke="white" 
          stroke-width="5" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          fill="none"/>
  </g>
</svg>