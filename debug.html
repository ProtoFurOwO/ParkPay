<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ParkPay - Debug Status</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            color: white;
        }
        .debug-container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255,255,255,0.1);
            padding: 30px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }
        .status-item {
            margin: 15px 0;
            padding: 15px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            border-left: 4px solid #00ff88;
        }
        .status-error {
            border-left-color: #ff4444;
        }
        .test-button {
            background: #007bff;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px;
            font-size: 16px;
        }
        .test-button:hover {
            background: #0056b3;
        }
        #console-output {
            background: #1a1a1a;
            color: #00ff00;
            padding: 20px;
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            white-space: pre-wrap;
            max-height: 400px;
            overflow-y: auto;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="debug-container">
        <h1>🔧 ParkPay Debug Status</h1>
        <p>Esta página te ayuda a diagnosticar problemas con la aplicación.</p>
        
        <h2>📋 Estado del Sistema</h2>
        <div id="status-checks"></div>
        
        <h2>🧪 Pruebas de Funcionalidad</h2>
        <button class="test-button" onclick="testLogin()">🔑 Probar Login Function</button>
        <button class="test-button" onclick="testJWT()">🎯 Probar JWT Utils</button>
        <button class="test-button" onclick="testServiceWorker()">⚙️ Probar Service Worker</button>
        <button class="test-button" onclick="testBackend()">🌐 Probar Backend</button>
        <button class="test-button" onclick="clearStorage()">🧹 Limpiar Storage</button>
        
        <div id="console-output"></div>
        
        <h2>🔗 Enlaces Útiles</h2>
        <p>
            <a href="/" style="color: #87ceeb;">← Volver al Login</a> | 
            <a href="/inicio.html" style="color: #87ceeb;">Ir a Inicio</a> | 
            <a href="/icon-generator.html" style="color: #87ceeb;">Generar Iconos PWA</a>
        </p>
    </div>

    <script>
        const output = document.getElementById('console-output');
        const statusChecks = document.getElementById('status-checks');

        function log(message) {
            const timestamp = new Date().toLocaleTimeString();
            output.textContent += `[${timestamp}] ${message}\n`;
            output.scrollTop = output.scrollHeight;
            console.log(message);
        }

        function addStatus(title, status, message) {
            const div = document.createElement('div');
            div.className = `status-item ${status === 'error' ? 'status-error' : ''}`;
            div.innerHTML = `<strong>${title}:</strong> ${message}`;
            statusChecks.appendChild(div);
        }

        function runStatusChecks() {
            // Check localStorage
            try {
                localStorage.setItem('test', 'test');
                localStorage.removeItem('test');
                addStatus('LocalStorage', 'ok', '✅ Funcionando correctamente');
            } catch (e) {
                addStatus('LocalStorage', 'error', '❌ No disponible: ' + e.message);
            }

            // Check Service Worker
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then(registrations => {
                    if (registrations.length > 0) {
                        addStatus('Service Worker', 'ok', `✅ Registrado (${registrations.length} activos)`);
                    } else {
                        addStatus('Service Worker', 'error', '❌ No registrado');
                    }
                });
            } else {
                addStatus('Service Worker', 'error', '❌ No soportado por el navegador');
            }

            // Check JWT functions
            if (typeof obtenerToken === 'function') {
                addStatus('JWT Functions', 'ok', '✅ Funciones JWT cargadas');
            } else {
                addStatus('JWT Functions', 'error', '❌ Funciones JWT no encontradas');
            }

            // Check login function
            if (typeof handleLogin === 'function') {
                addStatus('Login Function', 'ok', '✅ handleLogin disponible');
            } else if (typeof window.handleLogin === 'function') {
                addStatus('Login Function', 'ok', '✅ window.handleLogin disponible');
            } else {
                addStatus('Login Function', 'error', '❌ handleLogin no encontrado');
            }

            // Check current token
            try {
                const token = localStorage.getItem('jwt_token');
                if (token) {
                    addStatus('JWT Token', 'ok', `✅ Token presente (${token.substring(0, 20)}...)`);
                } else {
                    addStatus('JWT Token', 'ok', '⚪ Sin token (normal si no has hecho login)');
                }
            } catch (e) {
                addStatus('JWT Token', 'error', '❌ Error leyendo token: ' + e.message);
            }
        }

        async function testLogin() {
            log('🔑 Probando función de login...');
            
            if (typeof handleLogin === 'function') {
                log('✅ handleLogin encontrado como función global');
            } else if (typeof window.handleLogin === 'function') {
                log('✅ window.handleLogin encontrado');
            } else {
                log('❌ handleLogin NO encontrado');
                return;
            }

            // Crear un evento mock para probar
            const mockEvent = {
                preventDefault: () => log('📝 preventDefault() llamado correctamente')
            };

            try {
                log('🧪 Nota: Esta es solo una prueba de que la función existe');
                log('📌 Para probar realmente, usa el formulario de login principal');
            } catch (e) {
                log('❌ Error en función login: ' + e.message);
            }
        }

        async function testJWT() {
            log('🎯 Probando funciones JWT...');
            
            // Test obtener token
            try {
                if (typeof obtenerToken === 'function') {
                    const token = obtenerToken();
                    log(`📦 obtenerToken(): ${token ? 'Token encontrado' : 'Sin token'}`);
                } else {
                    log('❌ obtenerToken() no encontrado');
                }
            } catch (e) {
                log('❌ Error en obtenerToken: ' + e.message);
            }

            // Test guardar token
            try {
                if (typeof guardarToken === 'function') {
                    log('📝 guardarToken() encontrado');
                } else {
                    log('❌ guardarToken() no encontrado');
                }
            } catch (e) {
                log('❌ Error accediendo a guardarToken: ' + e.message);
            }
        }

        async function testServiceWorker() {
            log('⚙️ Probando Service Worker...');
            
            if ('serviceWorker' in navigator) {
                try {
                    const registrations = await navigator.serviceWorker.getRegistrations();
                    log(`📊 Service Workers registrados: ${registrations.length}`);
                    
                    registrations.forEach((reg, index) => {
                        log(`SW ${index + 1}: ${reg.scope}`);
                    });
                    
                    if (registrations.length === 0) {
                        log('🔄 Intentando registrar Service Worker...');
                        const reg = await navigator.serviceWorker.register('/sw-simple.js');
                        log('✅ Service Worker registrado: ' + reg.scope);
                    }
                } catch (e) {
                    log('❌ Error con Service Worker: ' + e.message);
                }
            } else {
                log('❌ Service Worker no soportado');
            }
        }

        async function testBackend() {
            log('🌐 Probando conexión al backend...');
            
            try {
                const response = await fetch('https://parkpay-backend-1ti1.onrender.com/api/test');
                log(`📡 Status: ${response.status} ${response.statusText}`);
                
                if (response.ok) {
                    const data = await response.text();
                    log(`📄 Respuesta: ${data.substring(0, 100)}...`);
                } else {
                    log('⚠️ Backend respondió pero con error');
                }
            } catch (e) {
                log('❌ Error conectando al backend: ' + e.message);
                log('💡 Esto es normal si el backend está en "cold start"');
            }
        }

        function clearStorage() {
            log('🧹 Limpiando localStorage...');
            
            const keys = ['jwt_token', 'usuario', 'vehiculos'];
            keys.forEach(key => {
                if (localStorage.getItem(key)) {
                    localStorage.removeItem(key);
                    log(`✅ Eliminado: ${key}`);
                } else {
                    log(`⚪ Ya limpio: ${key}`);
                }
            });
            
            log('✨ LocalStorage limpio');
        }

        // Ejecutar checks al cargar
        window.addEventListener('load', () => {
            log('🚀 ParkPay Debug Status iniciado');
            runStatusChecks();
        });
    </script>

    <!-- Cargar los scripts de la app para poder probarlos -->
    <script src="/js/jwt-utils.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
